services:
  # ─── 인프라 ───────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: orderuser
      POSTGRES_PASSWORD: orderpass
      POSTGRES_DB: orderdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/migrations/002_autovacuum_tuning.sql:/docker-entrypoint-initdb.d/02_autovacuum.sql
      - ./database/migrations/003_integration_tables.sql:/docker-entrypoint-initdb.d/03_integration.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderuser -d orderdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7-jammy
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --tcp-backlog 511
      --hz 20
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── BBQ Gateway (Express + Socket.IO) ───────────────────
  bbq-server:
    build:
      context: ./bbq_project/server
      dockerfile: Dockerfile
    env_file:
      - .env.local
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/bbq_order
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DISABLE_RATE_LIMIT: "true"
      NEST_BRIDGE_URL: http://nestjs:3000
      NEST_BRIDGE_API_KEY: local-dev-bridge-key
    ports:
      - "4000:4000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ─── NestJS Order Processing ──────────────────────────────
  nestjs:
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .env.local
    environment:
      APP_MODE: all
      PORT: 3000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: orderuser
      DATABASE_PASSWORD: orderpass
      DATABASE_NAME: orderdb
      REDIS_HOST: redis
      REDIS_PORT: 6379
      NODE_ENV: development
      BBQ_GATEWAY_URL: http://bbq-server:4000
      BBQ_API_KEY: local-dev-bridge-key
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  mongo_data:
